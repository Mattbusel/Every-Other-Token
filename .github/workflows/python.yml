name: Python package

# Builds, tests and publishes the `every-other-token` Python package from
# python/. Push a tag like py-v0.1.0 to publish to PyPI.
#
# Publishing uses PyPI trusted publishing (OIDC), so no API token is stored.
# One-time setup on pypi.org: add a (pending) trusted publisher for project
# "every-other-token" with owner Mattbusel, repository Every-Other-Token,
# workflow python.yml and environment pypi.
on:
  push:
    tags:
      - "py-v[0-9]+.[0-9]+.[0-9]+*"
  pull_request:
    paths:
      - "python/**"
      - ".github/workflows/python.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: python

jobs:
  test:
    name: Test (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install with the openai SDK (exercises SDK objects)
        run: python -m pip install ".[test]" openai
      - name: Test
        run: python -m pytest -q

  build:
    name: Build wheel and sdist
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches pyproject.toml
        if: startsWith(github.ref, 'refs/tags/py-v')
        run: |
          want="${GITHUB_REF_NAME#py-v}"
          have="$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$want" != "$have" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject version $have" >&2
            exit 1
          fi
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Smoke-test the built wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/eot-py tests/fixtures/chat_completion.json --format json > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: python/dist/

  publish:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/py-v')
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/every-other-token
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
