<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-labelledby="t d">
<title id="t">How every-other-token works</title>
<desc id="d">Four stages: intercept the LLM token stream, score each token with confidence exp(logprob) and perplexity exp(-logprob), mutate every other token, output to terminal, web UI or JSON. Shown on a real mock run: The quick brown fox jumps over becomes The kciuq brown xof jumps revo.</desc>
<style>.s{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style>
<rect x="0" y="0" width="1000" height="640" rx="18" fill="#11141a"/>
<text class="s" x="30" y="46" font-size="28" font-weight="700" fill="#e8ecf1">How it works</text>
<text class="s" x="210" y="46" font-size="18" fill="#9aa4b2">one real run: --provider mock, transform reverse, rate 0.5</text>
<rect x="20" y="72" width="225" height="112" rx="12" fill="#1a1f27" stroke="#2c3440" stroke-width="2"/>
<text class="s" x="38" y="106" font-size="22" font-weight="700" fill="#e8ecf1">1  Intercept</text>
<text class="s" x="38" y="138" font-size="17" fill="#9aa4b2">reads the live stream</text>
<text class="s" x="38" y="164" font-size="17" fill="#9aa4b2">OpenAI, Anthropic, mock</text>
<path d="M247 128 L263 128" stroke="#2c3440" stroke-width="3"/>
<circle r="5" fill="#ff6a2b"><animateMotion dur="1.2s" repeatCount="indefinite" path="M247 128 L263 128"/></circle>
<rect x="265" y="72" width="225" height="112" rx="12" fill="#1a1f27" stroke="#2c3440" stroke-width="2"/>
<text class="s" x="283" y="106" font-size="22" font-weight="700" fill="#e8ecf1">2  Score</text>
<text class="s" x="283" y="138" font-size="17" fill="#9aa4b2">confidence = exp(lp)</text>
<text class="s" x="283" y="164" font-size="17" fill="#9aa4b2">perplexity = exp(-lp)</text>
<path d="M492 128 L508 128" stroke="#2c3440" stroke-width="3"/>
<circle r="5" fill="#ff6a2b"><animateMotion dur="1.2s" repeatCount="indefinite" path="M492 128 L508 128"/></circle>
<rect x="510" y="72" width="225" height="112" rx="12" fill="#1a1f27" stroke="#2c3440" stroke-width="2"/>
<text class="s" x="528" y="106" font-size="22" font-weight="700" fill="#ff6a2b">3  Mutate</text>
<text class="s" x="528" y="138" font-size="17" fill="#9aa4b2">every other token</text>
<text class="s" x="528" y="164" font-size="17" fill="#9aa4b2">(--rate, --min-confidence)</text>
<path d="M737 128 L753 128" stroke="#2c3440" stroke-width="3"/>
<circle r="5" fill="#ff6a2b"><animateMotion dur="1.2s" repeatCount="indefinite" path="M737 128 L753 128"/></circle>
<rect x="755" y="72" width="225" height="112" rx="12" fill="#1a1f27" stroke="#2c3440" stroke-width="2"/>
<text class="s" x="773" y="106" font-size="22" font-weight="700" fill="#e8ecf1">4  Output</text>
<text class="s" x="773" y="138" font-size="17" fill="#9aa4b2">terminal, web UI, JSON</text>
<text class="s" x="773" y="164" font-size="17" fill="#9aa4b2">CSV, heatmap, replay</text>
